
name: Build and Test RaceDay API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay.API/RaceDay.API.sln

      - name: Build solution
        run: dotnet build RaceDay.API/RaceDay.API.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RaceDay.API.Tests/RaceDay.API.Tests.csproj --configuration Release
