

name: Validate RaceDay Planning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List repository files
        run: |
          echo "Current directory:"
          pwd
          echo "Repository root:"
          ls -la
          echo "Documentation files:"
          ls -la docs || true

      - name: Check ERD PDF
        run: |
          test -f docs/ERD_RaceDay.pdf
          echo "ERD PDF exists"

      - name: Check endpoint plan
        run: |
          test -f docs/endpoint-plan.pdf
          echo "Endpoint plan exists"

      - name: Check database SQL
        run: |
          test -f docs/database.sql
          echo "Database SQL file exists"

      - name: Check SQL file is not empty
        run: |
          test -s docs/database.sql
          echo "SQL script exists and is not empty"

      - name: Validation successful
        run: echo "RaceDay planning repository validation passed!"
