
name: Validate RaceDay Planning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ERD PDF
        run: test -s docs/ERD_RaceDay.pdf

      - name: Check endpoint plan
        run: test -s docs/endpoint-plan.pdf

      - name: Check database SQL
        run: test -s database.sql

      - name: Validation successful
        run: echo "RaceDay planning repository validation passed!"
